name: Website bauen

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * *" # täglich, damit Termine und Zeiträume mitwandern
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

      - name: BGG-Daten holen
        run: node skripte/bgg-abruf.mjs
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}

      - name: Seite bauen
        run: npx eleventy
        env:
          # Mit eigener Domain: Variable EIGENE_DOMAIN=ja setzen, dann liegt die Seite im Hauptverzeichnis
          PFAD_PREFIX: ${{ vars.EIGENE_DOMAIN == 'ja' && '/' || format('/{0}/', github.event.repository.name) }}

      - name: Cache und Warnungen sichern
        run: |
          git config user.name "website-bot"
          git config user.email "website-bot@users.noreply.github.com"
          # Einzeln hinzufügen: Fehlt ein Pfad, würde ein gemeinsames git add alle anderen mit verwerfen
          for pfad in daten/WARNUNGEN.md daten/bgg-cache.json daten/id-vorschlaege.json src/assets/cover; do
            if [ -e "$pfad" ]; then git add -A "$pfad"; fi
          done
          git diff --cached --quiet || (git commit -m "Daten aktualisiert" && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
